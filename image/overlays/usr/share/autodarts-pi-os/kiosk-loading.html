<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autodarts Pi OS wird gestartet</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      background: #0b1110;
      color: #f4f7f5;
      font-family: system-ui, sans-serif;
    }
    main { width: min(760px, 82vw); text-align: center; }
    img {
      display: block;
      width: min(560px, 70vw);
      max-height: 58vh;
      margin: 0 auto 28px;
      object-fit: contain;
    }
    h1 { margin: 0 0 22px; font-size: clamp(22px, 3vw, 36px); letter-spacing: 0; }
    .track {
      height: 18px;
      overflow: hidden;
      border: 1px solid #405147;
      border-radius: 6px;
      background: #19221d;
    }
    .fill {
      width: 0;
      height: 100%;
      background: #64df4b;
      transition: width 120ms linear;
    }
    .status {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      color: #b8c4bd;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main>
    <img src="splash.png" alt="Autodarts Pi OS">
    <h1>Autodarts Pi OS wird gestartet</h1>
    <div class="track" role="progressbar" aria-label="Systemstart" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="fill"></div>
    </div>
    <div class="status"><span>Setup und Kiosk werden vorbereitet</span><strong>0 %</strong></div>
  </main>
  <script>
    const target = decodeURIComponent(location.hash.slice(1) || "https%3A%2F%2Fplay.autodarts.io");
    const fill = document.querySelector(".fill");
    const progress = document.querySelector("[role=progressbar]");
    const value = document.querySelector(".status strong");
    const started = performance.now();
    const duration = 2400;

    function draw(now) {
      const elapsed = Math.min(1, (now - started) / duration);
      const percent = Math.min(96, Math.round(elapsed * 96));
      fill.style.width = `${percent}%`;
      value.textContent = `${percent} %`;
      progress.setAttribute("aria-valuenow", String(percent));
      if (elapsed < 1) requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);
    setTimeout(() => {
      fill.style.width = "100%";
      value.textContent = "100 %";
      progress.setAttribute("aria-valuenow", "100");
      setTimeout(() => location.replace(target), 220);
    }, duration);
  </script>
</body>
</html>
